[project]
name = "cistern"
version = "0.1.0"
description = "Tensor tables for the cistern checkpoint writer"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
cistern-tables = "cistern_tables.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cistern_tables"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
